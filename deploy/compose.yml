# Runs on the server behind Caddy (deploy/Caddyfile). Image is built by CI or `docker compose build`.
services:
  website:
    image: ghcr.io/pkuinfo/pkuharness-website:latest
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    restart: unless-stopped
    env_file: .env # GITHUB_TOKEN (read-only, for releases + marketplace scans), NEXT_PUBLIC_SITE_URL
    ports:
      - 127.0.0.1:3100:3000
