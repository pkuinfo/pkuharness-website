name: Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/pkuinfo/pkuharness-website:latest
            ghcr.io/pkuinfo/pkuharness-website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One registry version per publish (no attestation manifests), so cleanup below can
          # never delete a piece the current image still references.
          provenance: false
          sbom: false
      # Keep only the image just published; older versions are deleted to save space.
      # Roll back by rebuilding an older commit (workflow_dispatch on that ref).
      - uses: actions/delete-package-versions@v5
        with:
          package-name: pkuharness-website
          package-type: container
          min-versions-to-keep: 1
