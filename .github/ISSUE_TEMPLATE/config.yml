blank_issues_enabled: false
contact_links:
  - name: Submit a plugin to the marketplace
    url: https://harness.novadiffusion.com/marketplace/submit
    about: Scan your repo and submit it from the website. This opens a prefilled "Plugin submission" issue.
  - name: Report a security vulnerability
    url: https://github.com/pkuinfo/pkuharness-website/security/advisories/new
    about: Please report privately. Don't open a public issue (see SECURITY.md).
  - name: Problems with the app
    url: https://github.com/pkuinfo/pku-harness/issues/new/choose
    about: Crashes, login, chat, dashboard, schedule and other in-app issues belong in pku-harness.
  - name: Plugins, campus services and the SDK
    url: https://github.com/pkuinfo/pku-harness-plugins/issues/new/choose
    about: A campus service is broken, you want a new one, or you have a plugin or SDK question.
