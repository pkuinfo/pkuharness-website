name: Website bug
description: Something on the website is broken or wrong (page, marketplace, docs rendering, download).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include personal data such as student IDs, names or tokens.
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://harness.novadiffusion.com/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: env
    attributes:
      label: Browser, OS and theme
      placeholder: Chrome 140 on Android 15, dark theme
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Redact anything personal.
